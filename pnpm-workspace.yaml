packages:
  - '.'

allowBuilds:
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@eslint/eslintrc@3.3.7'
  - bullmq@6.3.4
  - lucide-react@1.39.0

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@tailwindcss/oxide'
  - esbuild
  - msgpackr-extract
  - protobufjs
  - sharp
  - unrs-resolver
